<?xml version="1.0" encoding="UTF-8"?>
<!-- Visualab Effects test fixture (original work, MIT OR Apache-2.0): basic shapes, groups, transforms. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 400 200">
  <title>Basic shapes</title>
  <rect id="bg" x="0" y="0" width="400" height="200" fill="#202830"/>
  <g id="left" transform="translate(20 20)" opacity="0.8">
    <rect id="box" x="10" y="10" width="120" height="80" rx="12" fill="tomato" stroke="white" stroke-width="6"/>
    <circle id="dot" cx="70" cy="130" r="30" fill="rgb(40, 180, 255)"/>
  </g>
  <g id="right" transform="translate(220 0) rotate(15 80 100)">
    <ellipse cx="80" cy="60" rx="70" ry="30" fill="gold" fill-opacity="0.75"/>
    <polygon points="20,180 80,110 140,180" fill="none" stroke="#7CFC00" stroke-width="8" stroke-linejoin="round"/>
    <line x1="10" y1="100" x2="150" y2="100" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
