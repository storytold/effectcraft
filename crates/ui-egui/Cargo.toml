[package]
name = "effectcraft-ui-egui"
description = "The EffectCraft egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
effectcraft-time = { workspace = true }
effectcraft-geom = { workspace = true }
effectcraft-color = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-path = { workspace = true }
effectcraft-text = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-engine = { workspace = true }
effectcraft-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Screen-reader support on desktop. eframe 0.36 only offers `accesskit` with
# `android-game-activity`, so Android builds (NativeActivity) go without it.
eframe = { workspace = true, features = ["accesskit"] }

[target.'cfg(target_os = "android")'.dependencies]
# eframe's Android backend (NativeActivity via winit). Without it android-activity
# builds with no backend and fails to compile; the headless CLI reaches eframe
# through this crate.
eframe = { workspace = true, features = ["android-native-activity"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
effectcraft-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
