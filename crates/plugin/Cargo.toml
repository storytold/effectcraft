[package]
name = "effectcraft-plugin"
description = "EffectCraft effect plug-ins: loads sandboxed WebAssembly effect modules (WebAssembly ABI v1 and v2) into the effect registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The WebAssembly runtime (wasmtime with Cranelift JIT compilation + deterministic NaN
# canonicalisation, fuel metering, memory limits and SIMD; #3206). Hosts enable it on native;
# without it `load_wasm` reports that WebAssembly plug-ins are unavailable.
wasm = ["dep:wasmtime", "dep:rayon"]

[dependencies]
effectcraft-effects = { workspace = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true }
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-raster = { workspace = true }
