# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    # Dependabot bumps are checked by CI; skip CodeRabbit reviews on them.
    ignore_usernames:
      - "dependabot[bot]"
  path_instructions:
    # Japanese wording follows the reference application's own Japanese interface rather than a
    # paraphrase, because people arrive from that application and look for its words. Exact-value
    # tests in `ui.rs` hold selected rows, so the burden of proof belongs to whoever changes a row,
    # not to whoever wrote it.
    #
    # `i18n.rs` is the fixed menu catalog and sits outside `i18n/**`, so it needs its own entry;
    # without it the menus, where most of these rows live, would be reviewed without the rule.
    - path: "crates/ui-egui/src/i18n.rs"
      instructions: |
        Japanese rows that name a command, panel, control or dialog are taken from the reference
        application's own Japanese interface. If a pull request changes any such
        reference-application row, whether or not that row has an exact-value test, ask the author
        for the window that shows the new wording and its version string, as local evidence. A
        screenshot may come with it but is not kept in this repository: the project ships no
        reference-application assets. A paraphrase that reads well in English is still wrong for
        someone who knows that interface, so ask for the evidence before the rewrite is merged; a
        rewrite that comes with it is fine.

        Strings that exist only in this application - このアプリについて and the crash dialog, for
        example - have no counterpart to read off. For those, ask for a screenshot of this
        application showing the string, and review the wording rather than any match.
    - path: "crates/ui-egui/src/i18n/**"
      instructions: |
        Japanese rows that name a command, panel, control or dialog are taken from the reference
        application's own Japanese interface. If a pull request changes any such
        reference-application row, whether or not that row has an exact-value test, ask the author
        for the window that shows the new wording and its version string, as local evidence. A
        screenshot may come with it but is not kept in this repository: the project ships no
        reference-application assets. A paraphrase that reads well in English is still wrong for
        someone who knows that interface, so ask for the evidence before the rewrite is merged; a
        rewrite that comes with it is fine.

        Strings that exist only in this application - このアプリについて and the crash dialog, for
        example - have no counterpart to read off. For those, ask for a screenshot of this
        application showing the string, and review the wording rather than any match.
