sonar.projectKey=storytold_effectcraft
sonar.organization=storytold

# crates/aep/tests/fixtures/tools/ holds the contributor's offline generators of the AEP test
# corpus (Node and ExtendScript run by hand against a local folder, see its README). They are not
# shipped or run by the app or CI, so they are not analysed.
sonar.exclusions=crates/aep/tests/fixtures/tools/**

# S1523 / S2137 (eval, Function): the expression runtime in crates/expr/src/prelude.js replaces
# `eval` and `Function` on purpose, with wrappers that check the code they are given before it
# runs (After Effects expressions may call them). The rules flag exactly that wrapping.
#
# S7773 / S8786 (Number.isFinite and friends, String.trim): the .jsx scripts are After Effects
# ExtendScript, which is ES3. They also run in After Effects, which has neither.
sonar.issue.ignore.multicriteria=prelude_eval,prelude_redefine,jsx_es3_globals,jsx_es3_trim
sonar.issue.ignore.multicriteria.prelude_eval.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.prelude_eval.resourceKey=crates/expr/src/prelude.js
sonar.issue.ignore.multicriteria.prelude_redefine.ruleKey=javascript:S2137
sonar.issue.ignore.multicriteria.prelude_redefine.resourceKey=crates/expr/src/prelude.js
sonar.issue.ignore.multicriteria.jsx_es3_globals.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.jsx_es3_globals.resourceKey=**/*.jsx
sonar.issue.ignore.multicriteria.jsx_es3_trim.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.jsx_es3_trim.resourceKey=**/*.jsx
