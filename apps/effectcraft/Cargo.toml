[package]
name = "effectcraft"
description = "EffectCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "effectcraft"

[lib]
# The desktop binary and Android's entry shim (apps/effectcraft-android) share this library.
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-ui-egui = { workspace = true }
egui = { workspace = true }
# `links`: links (Help menu, Discord, Settings) open in the system browser.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "links"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The window's monitors, size and position (src/window.rs), and macOS event-loop options (no app
# activation when driven by an agent). The same winit eframe runs on.
winit = { version = "0.30", default-features = false }
pollster = { workspace = true }
cpal = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# The NativeActivity handle eframe's event loop needs (`NativeOptions.android_app`); the
# same 0.6 instance winit and eframe use, so the handle passes across crates as one type.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
[target.'cfg(not(target_os = "android"))'.dependencies]
# File and message dialogs. rfd has no Android backend (it doesn't compile there), so
# Android builds leave the file hooks empty and the commands fail with
# "no file dialog available".
rfd = { workspace = true }
# Screen-reader support and the desktop windowing backends. eframe 0.36 only offers
# `accesskit` with `android-game-activity`, and Wayland/X11 don't exist on Android.
eframe = { workspace = true, features = ["accesskit", "wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with System: the XDG desktop portal's colour scheme. Already in
# Cargo.lock (accesskit, through eframe), so it adds no new crates.
zbus = "5.19"

[build-dependencies]
# Icon + VERSIONINFO for effectcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep the control channel responsive when the window is covered (App Nap / occlusion throttling).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }
# The native menu bar (NSMenu). MIT OR Apache-2.0; macOS only, never in the web build.
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
# NSApplication hide / hide others / show all, and the pasteboard for Edit ▸ Paste in text fields.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard"] }
# Finder double-click, Open With, Dock drops and `open -a EffectCraft x.ecproj` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# PhotoCraft and PdfCraft) registers the handler (Objective-C interop needs unsafe, which our
# workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
