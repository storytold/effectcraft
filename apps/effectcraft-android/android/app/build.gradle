plugins {
    id 'com.android.application'
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "ai.storyteller.effectcraft"
        minSdk = 31
        targetSdk = 35
        versionCode = 1
        versionName = "0.16.0"
    }

    sourceSets {
        main {
            // The output directory of
            // `cargo ndk -t arm64-v8a -o apps/effectcraft-android/jniLibs build --release -p effectcraft-android`
            jniLibs.srcDirs = ['../../jniLibs']
        }
    }

    packaging {
        jniLibs {
            // cargo-ndk copies every cdylib in the target directory, and boa_engine (the script
            // engine) builds one. libmain.so does not link against it (`readelf -d` lists only
            // liblog/libandroid/libdl/libm/libc), so it stays out of the APK.
            excludes += ['libboa_engine*.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Debug signing for local testing, so the release APK installs with `adb install -r`.
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'ai.storyteller.effectcraft'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // GameActivity (not NativeActivity): eframe's Android backend needs it for input and IME.
    implementation "androidx.games:games-activity:4.4.0"
}
