[package]
name = "effectcraft-cli"
description = "EffectCraft headless CLI: render frames and sequences, run commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "effectcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "effectcraft-cli"
path = "src/main.rs"

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-automation = { workspace = true }
effectcraft-ui-egui = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-gpu = { workspace = true }
effectcraft-time = { workspace = true }
effectcraft-track = { workspace = true }
effectcraft-segment = { workspace = true }
effectcraft-sam2 = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
cpu-time = "1"

[dev-dependencies]
# Shell completions and man pages (examples/man-and-completions.rs, for the packages); not in the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
